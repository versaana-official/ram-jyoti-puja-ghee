backend:
  name: github
  repo: versaana-official/ram-jyoti-puja-ghee
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "products"
    label: "Product Variants"
    folder: "content/products"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Variant ID", name: "id", widget: "string"}
      - {label: "Pack Size", name: "size", widget: "string"}
      - {label: "Price (₹)", name: "price", widget: "number"}
      - {label: "Tag Badge", name: "tag", widget: "string", default: "Starter Pack"}
      - {label: "Product Images", name: "images", widget: "string"}
      - {label: "Description", name: "desc", widget: "text"}
      - {label: "In Stock", name: "inStock", widget: "boolean", default: true}
