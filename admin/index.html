<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RamJyoti Content Manager</title>
</head>
<body>
    <script>
        window.CMS_MANUAL_INIT = true;
    </script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
        CMS.init({
            config: {
                backend: {
                    name: "github",
                    repo: "versaana-official/ram-jyoti-puja-ghee",
                    branch: "main",
                    base_url: "https://netlify-cms.adrianub.vercel.app"
                },
                media_folder: "images/uploads",
                public_folder: "/images/uploads",
                collections: [
                    {
                        name: "products",
                        label: "Product Variants",
                        folder: "content/products",
                        create: true,
                        slug: "{{slug}}",
                        fields: [
                            {label: "Variant ID", name: "id", widget: "string"},
                            {label: "Pack Size", name: "size", widget: "string"},
                            {label: "Price (₹)", name: "price", widget: "number"},
                            {label: "Tag Badge", name: "tag", widget: "string", default: "Starter Pack"},
                            {label: "Product Images", name: "images", widget: "string"},
                            {label: "Description", name: "desc", widget: "text"},
                            {label: "In Stock", name: "inStock", widget: "boolean", default: true}
                        ]
                    }
                ]
            }
        });
    </script>
</body>
</html>
